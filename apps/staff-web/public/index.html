<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>M Pizza</title>
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <main class="login">
      <form id="login-form" autocomplete="on">
        <h1 data-i18n="appName">إم بيتزا</h1>
        <div class="field">
          <label for="username" data-i18n="username">اسم المستخدم</label>
          <input id="username" name="username" autocomplete="username" required minlength="3" maxlength="64" autocapitalize="none" />
        </div>
        <div class="field">
          <label for="password" data-i18n="password">كلمة المرور</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required minlength="8" maxlength="200" />
        </div>
        <p id="login-error" class="error" role="alert"></p>
        <button class="primary" type="submit" id="submit" data-i18n="signIn">دخول</button>
        <button type="button" id="lang">English</button>
      </form>
    </main>
    <script type="module" src="js/login.js"></script>
  </body>
</html>
